name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install skills-ref==0.1.1
      # The validator takes the skill name from the directory name, which the
      # checkout gives as the repo name (skills-memory-cleanup).
      - run: ln -s "$PWD" /tmp/memory-cleanup && agentskills validate /tmp/memory-cleanup
